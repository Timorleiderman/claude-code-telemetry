name: claude-code-telemetry

services:
  # Receives OTLP from Claude Code, fans out to Prometheus (metrics) and Loki (events).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: cc-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC   <- point Claude Code here
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:8889:8889"   # Prometheus scrape target
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: cc-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:latest
    container_name: cc-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:latest
    container_name: cc-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

  # The documentation site for this stack. http://localhost:8000
  # Live-reloads as you edit anything under ./docs.
  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: cc-docs
    restart: unless-stopped
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    volumes:
      - ./:/docs
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
